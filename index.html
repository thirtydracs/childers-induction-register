<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRT9SYjuRCNvmZDbM0SRjP5xQz9mrm7NVbVzXabep8t0JCNFISYo6x4c41qrJO83XWnYvoBj7LjDE2D/pub?output=csv";

let data = [];

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {

    const rows = text.split("\n").map(r => r.split(","));
    const headers = rows[0];

    const find = (name) =>
      headers.findIndex(h => h.toLowerCase().includes(name));

    // 🔑 MATCH YOUR HEADINGS
    const firstNameI = find("first");
    const surnameI = find("surname");
    const mobileI = find("mobile");
    const companyI = find("company");
    const dateI = find("date");

    data = rows.slice(1).map(r => {

      const fullName = `${r[firstNameI] || ""} ${r[surnameI] || ""}`.trim();
      const inducted = r[dateI];

      return {
        name: fullName,
        company: r[companyI],
        mobile: r[mobileI],
        date: inducted,
        status: inducted // if date exists = valid
      };
    });

    render(data);
    stats(data);
  });

function render(list) {
  let html = "";

  list.forEach(d => {

    const ok = d.status;
    const bar = ok ? "valid-bar" : "invalid-bar";
    const cls = ok ? "valid" : "invalid";
    const label = ok ? "VALID" : "MISSING";

    html += `
      <div class="card">
        <div class="bar ${bar}"></div>

        <div class="content">
          <div class="name">${d.name || "Unknown"}</div>
          <div class="company">${d.company || ""}</div>

          <div class="row">
            <div>${d.mobile || ""}</div>
            <div class="${cls}">${label}</div>
          </div>

          <div class="row">
            <div>Inducted: ${d.date || "-"}</div>
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

function stats(list) {
  const total = list.length;
  const valid = list.filter(d => d.status).length;

  document.getElementById("total").innerText = total;
  document.getElementById("valid").innerText = valid;
  document.getElementById("missing").innerText = total - valid;
}

document.getElementById("search").addEventListener("keyup", e => {
  const term = e.target.value.toLowerCase();

  const filtered = data.filter(d =>
    (d.name + " " + d.company + " " + d.mobile)
      .toLowerCase()
      .includes(term)
  );

  render(filtered);
});
</script>
